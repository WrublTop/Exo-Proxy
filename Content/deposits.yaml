# Authored field-deposit placement.
#   placement: area   — random tile within [anchor ± variation] (a square,
#     retried off hazards / bases / other deposits), rolled once at campaign
#     start and frozen (persisted). DEV RESET re-rolls.
#   placement: fixed  — exact x/y, no validation (author's responsibility).
#
# tier (proks only, 1..3 = common/rich/prime): sets the assay quality band and
#   sync reward. INDEPENDENT of position — a low-tier seam can sit near base, a
#   prime one far. Ignored for EM.
#
# THERMAL (proks): no sol window, collectible until extracted.
# EM (signal): sol_start/sol_end (inclusive) — live only in that window, then
#   gone for good.
#
