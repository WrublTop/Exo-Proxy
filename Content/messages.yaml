  subject: "Understanding 'The Blue Longing'"
  sol: SOL 040
  can_reply: false
  locked: false
  body: |
    Dear Operator 0-45,

    Your mental hygiene is our absolute priority! Today, let's talk about a rare psychological condition called The Blue Longing.

    Some sensitive individuals, after completing their contract on this beautiful planet, experience a deep feeling of sadness when they return to the dark, crowded megacities of Earth. Their nervous systems miss the unique peace of this world.

    To cure this temporary nostalgia, S.U.I.R.D.C. has created the Sleep Management Sector. Upon completion of your 365-day rotation, you will not have to face the harsh reality of Earth. Instead, you will be treated to a permanent, luxury relaxation therapy inside our specialized blue gel capsules.

    Your mind will remain here in a state of eternal, beautiful euphoria. Thank you for letting us care for you forever!

- id: relay_packet_044
