  sol: SOL 044
  can_reply: false
  locked: false
  body: |
    [AUTOMATED SYSTEM NOTICE: Operator 0-44 has completed their service. Incoming family mail has been automatically forwarded to the active terminal station for network optimization.]

    Jan,
    Why are you not writing back? The company on Mars told me your radio is just syncing, but it has been three weeks.
    We got the money you sent. Mom's doctor is happy, but I am worried about you. Your last voice message sounded so strange. Your voice was entirely flat. You had no emotion at all.
    You said you were starting to forget what my face looks like because your monitors only show gray shapes. You said the base was too quiet.
    Please send a blank message. Just let me know you are still there luv.
    — Adelaide

- id: unknown_ghost_note
  sender: unknown_source
  sender_display: "UNKNOWN_SOURCE"
  subject: "do not turn them down"
  sol: SOL 066
  can_reply: false
  locked: false
  body: |
    [SYSTEM ALERT: Unlinked text file recovered from deleted station storage space.]

    To the rookie:
    Do not look at the happy wellness messages on your screen. If you believe their friendly words, you will accept the silence of this metal coffin.
    They tell you the first colonists went home. They didn't. The company just let them walk out into the fields because happy slaves don't ask for wages.
    One vital warning: the ceiling fans make a loud, annoying, scraping noise. It will give you a headache. But do not turn them down to enjoy the "corporate comfort."
    If you turn them down, the base gets perfectly silent. And when this place gets silent, the air pressure changes and you will start smelling the vanilla. If you smell the vanilla, you will never want to go home. And that is exactly what the company wants.

