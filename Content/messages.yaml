- id: suirdc_blue_longing
  sender: suirdc
  sender_display: "Your S.U.I.R.D.C. Wellness Team"
  subject: "Understanding 'The Blue Longing'"
  sol: SOL 005
  can_reply: false
  locked: false
  body: |
    Dear Operator 0-45,

    Your mental hygiene is our absolute priority! Today, let's talk about a rare psychological condition called The Blue Longing.

    Some sensitive individuals, after completing their contract on this beautiful planet, experience a deep feeling of sadness when they return to the dark, crowded megacities of Earth. Their nervous systems miss the unique peace of this world.

    To cure this temporary nostalgia, S.U.I.R.D.C. has created the Sleep Management Sector. Upon completion of your 365-day rotation, you will not have to face the harsh reality of Earth. Instead, you will be treated to a permanent, luxury relaxation therapy inside our specialized blue gel capsules.

    Your mind will remain here in a state of eternal, beautiful euphoria. Thank you for letting us care for you forever!

- id: unknown_ghost_note
  sender: unknown_source
  sender_display: "UNKNOWN_SOURCE"
  subject: "do not turn them down"
  sol: SOL 005
  can_reply: false
  locked: false
  body: |
    [SYSTEM ALERT: Unlinked text file recovered from deleted station storage space.]

    To the rookie:
    Do not look at the happy wellness messages on your screen. If you believe their friendly words, you will accept the silence of this metal coffin.
    They tell you the first colonists went home. They didn't. The company just let them walk out into the fields because happy slaves don't ask for wages.
    One vital warning: the ceiling fans make a loud, annoying, scraping noise. It will give you a headache. But do not turn them down to enjoy the "corporate comfort."
    If you turn them down, the base gets perfectly silent. And when this place gets silent, the air pressure changes and you will start smelling the vanilla. If you smell the vanilla, you will never want to go home. And that is exactly what the company wants.

