# ============================ SOL 1 — ARRIVAL ============================

- id: vance_welcome
  sender: vance_e
  sender_display: "Overseer Vance"
  subject: "Welcome to Sektor C"
  sol: SOL 001
  can_reply: false
  locked: false
  body: |
    Operator 0-45,

    Your drop-pod has landed safely. Welcome to your Cage. For the next 365 days, you are the only human worker in this sector.

    Your terminal is set to read-only. You cannot send replies. We track your health and your work through your rover's computer. That is all the communication we need.

    Look at your main screen. Your rover video feed must always look blocky and boring. This is the SRC safety filter. If you see bright blue or gold colors on your screen, close your eyes. It means the filter is broken. You must never look at this planet without the filter.

    Your first shift starts now. Go to work.

- id: suirdc_wellness_welcome
  sender: suirdc
  sender_display: "Your S.U.I.R.D.C. Wellness Team"
  subject: "Your New Home: A Warm Welcome!"
  sol: SOL 001
  can_reply: false
  locked: false
  body: |
    Dear Operator 0-45,

    Congratulations on your safe arrival! We are so proud to have you in the S.U.I.R.D.C. family. For the next 365 days, you are the exclusive guardian of Sector C.

    Our automated systems will care for you by monitoring your vitals and your rover's data.

    Please ensure your main monitor is active. The screen should display simple, calm shapes. This is our patented SRC Comfort Filter, designed to protect your eyes from natural visual fatigue. If you see unfiltered blue or gold lights, please close your eyes immediately for your own safety and report a temporary hardware glitch.

    We wish you a peaceful, highly productive shift!

- id: suirdc_secure_care
  sender: suirdc
  sender_display: "SECURE_CARE_BOT"
  subject: "Protecting Your Family's Future"
  sol: SOL 001
  can_reply: false
  locked: false
  body: |
    Dear Operator 0-45,

    Because we care about your loved ones, S.U.I.R.D.C. has already secured your 500,000 Credit reward in our protected Earth escrow account. We love providing financial peace of mind.

    To protect this family investment, please remember our mutual care guidelines:

    - Unscheduled breaks or stopping the rover will freeze your family's financial support.
    - Any vehicle repair costs due to operator distraction will be deducted from your family fund.
    - In the sad event of self-harm, the credits will be redirected to our Corporate Care Fund to pay for your station's operational cleaning and replacement logistics.

    Your financial future is safe with us. Stay positive. Stay active.

- id: suirdc_history_lesson
  sender: suirdc
  sender_display: "SUIRDC_HISTORY"
  subject: "Honoring the Pioneers of Aethelgard"
  sol: SOL 001
  can_reply: false
  locked: false
  body: |
    Dear Operator 0-45,

    As you begin your rotation, let's look back at our beautiful corporate history! One hundred years ago, our grand transport ship, The Ark of Hope, brought the first human colonists here. Together, they built the historic city of Aethelgard.

    Thanks to their incredible passion, Aethelgard became a shining example of industrial success. Today, the city is gracefully decommissioned. Our records show that upon completing their contracts, the entire first generation of workers chose to remain on the planet permanently, entering an early, company-funded retirement in the outer valleys.

    If your video feed displays abandoned structures or old machinery, do not be alarmed! These are simply historical monuments to human achievement and the absolute satisfaction of our workers. We love our history, but we work for the future!

