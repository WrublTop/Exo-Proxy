- id: rec_archive_aeth_044
  display_name: RECOV_ARCHIVE_AETH_044
  type: LOG
  blocks: 4
  sol: SOL 001
  sync_value: 60
  description: RECOVERED LOG — OPERATOR 0-44
  content: |
    RECOVERED DATA BUFFER — ENCRYPTION CODES UNVERIFIED
    ORIGIN: STATION C DECOMMISSIONED CORE // USER: EVERYMAN-0-44

    SOL 1: The filter is flickering. I can see the edge of my steering screen
    turning bright gold. It is not a hardware glitch like the training emails
    said. The gray triangles on my screen aren't rocks. They are rows of
    pillars made of teeth.

    SOL 115: Vance called me on the direct voice channel today. Told me to
    close my eyes. I didn't. I stared at the valley for ten minutes without
    the grayscale mask. Earth is so dark, so loud, so messy. This planet...
    the gold light out there is so perfectly clean.

    SOL 119: Turning off the ceiling fans tonight. The scraping gives me a
    headache, and the sweet vanilla smell is coming out of my own throat
    anyway. I don't need this metal Cage anymore. The door override code is
    4412 but it doesn't even matter. The locks are soft now. The steel is
    ready to let me step out.

    [SECURITY] Storing this unencrypted archive violates corporate secrecy
    terms. S-LINK will auto-delete this file in 3 shifts unless submitted
    to orbit for formal clearance.

